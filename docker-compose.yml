services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: club_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
    - sql_data:/var/opt/mssql
    - ./sql-init:/docker-entrypoint-initdb.d
    command: /bin/bash /docker-entrypoint-initdb.d/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P Your_password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    build:
      context: ./ClubCanotajeApp
      dockerfile: Dockerfile
    container_name: club_api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ClubCanotaje;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      JwtSettings__SecretKey: "VerySecretKeyForJwtTokenGeneration"
      JwtSettings__Issuer: "ClubCanotajeAPI"
      JwtSettings__Audience: "ClubCanotajeWeb"
      JwtSettings__ExpirationMinutes: "60"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sql_data: